name: Build MoonWeb installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout MoonWeb
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer exists
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Filter '*.exe' -File
          if ($files.Count -eq 0) {
            Write-Error 'No Windows installer was produced.'
          }
          $files | Format-Table Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MoonWeb-Windows-Installer
          path: dist/MoonWeb-Setup-*-x64.exe
          if-no-files-found: error
